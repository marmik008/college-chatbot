<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --bg: #f8fafc;
      --chat-card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --bot-msg: #f1f5f9;
      --border: #e2e8f0;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #e0e7ff, #f8fafc 60%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 720px;
      background: var(--chat-card);
      border-radius: var(--radius);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 0 1px 1px var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 16px 20px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .bot-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      background: #eef2ff;
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      position: relative;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: #22c55e;
      border: 2px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      right: 0;
    }

    .profile-info h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .profile-info p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.25rem;
      padding: 6px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .clear-btn:hover {
      background: #fee2e2;
      color: #ef4444;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #fbfcfe;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 82%;
      animation: popIn 0.25s ease-out;
    }

    .message.bot {
      align-self: flex-start;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #eef2ff;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .bot .bubble {
      background: var(--bot-msg);
      color: var(--text);
      border-top-left-radius: 4px;
    }

    .user .bubble {
      background: var(--primary);
      color: #ffffff;
      border-top-right-radius: 4px;
    }

    .timestamp {
      font-size: 0.65rem;
      display: block;
      margin-top: 5px;
      opacity: 0.6;
      text-align: right;
    }

    .quick-chips {
      padding: 10px 16px;
      background: #ffffff;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      border-top: 1px solid var(--border);
    }

    .quick-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .chip:hover {
      background: #eef2ff;
      border-color: var(--primary);
      color: var(--primary);
    }

    .input-box {
      padding: 14px 16px;
      background: #ffffff;
      border-top: 1px solid var(--border);
    }

    .input-box form {
      display: flex;
      align-items: center;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 4px 6px 4px 16px;
      transition: border-color 0.2s ease;
    }

    .input-box form:focus-within {
      border-color: var(--primary);
    }

    .input-box input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 0.9rem;
      color: var(--text);
    }

    .send-button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s ease;
    }

    .send-button:hover {
      background: var(--primary-dark);
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <header class="header">
      <div class="bot-profile">
        <div class="avatar">
          <i class="ri-robot-line"></i>
          <span class="status-dot"></span>
        </div>
        <div class="profile-info">
          <h3>Campus Assistant</h3>
          <p>Admissions & Academic Support</p>
        </div>
      </div>
      <button class="clear-btn" id="clearBtn" title="Clear Chat">
        <i class="ri-refresh-line"></i>
      </button>
    </header>

    <!-- Chat Messages -->
    <main class="chat-messages" id="chatArea">
      <div class="message bot">
        <div class="msg-icon"><i class="ri-robot-line"></i></div>
        <div class="bubble">
          Hello! 👋 Welcome to our College Help Desk. Feel free to ask about courses, admission process, fees, or placements!
          <span class="timestamp" id="initTime"></span>
        </div>
      </div>
    </main>

    <!-- Suggestion Chips -->
    <div class="quick-chips">
      <button class="chip" onclick="sendQuick('What courses do you offer?')">📚 Courses</button>
      <button class="chip" onclick="sendQuick('How much is the college fee?')">💳 Fees</button>
      <button class="chip" onclick="sendQuick('Admission process and eligibility')">🎓 Admission</button>
      <button class="chip" onclick="sendQuick('Placement packages & top recruiters')">💼 Placements</button>
      <button class="chip" onclick="sendQuick('Hostel and mess details')">🏠 Hostel</button>
    </div>

    <!-- Input Footer -->
    <footer class="input-box">
      <form id="msgForm" autocomplete="off">
        <input type="text" id="userInput" placeholder="Ask a question..." required />
        <button type="submit" class="send-button" aria-label="Send">
          <i class="ri-send-plane-fill"></i>
        </button>
      </form>
    </footer>
  </div>

  <script>
    const chatArea = document.getElementById("chatArea");
    const msgForm = document.getElementById("msgForm");
    const userInput = document.getElementById("userInput");
    const clearBtn = document.getElementById("clearBtn");

    function getTime() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    document.getElementById("initTime").innerText = getTime();

    function addMessage(sender, text) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${sender}`;
      
      const icon = sender === "bot" ? `<div class="msg-icon"><i class="ri-robot-line"></i></div>` : "";
      
      msgDiv.innerHTML = `
        ${icon}
        <div class="bubble">
          ${text}
          <span class="timestamp">${getTime()}</span>
        </div>
      `;
      chatArea.appendChild(msgDiv);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    async function processMessage(text) {
      if (!text.trim()) return;
      addMessage("user", text);
      userInput.value = "";

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        addMessage("bot", data.reply);
      } catch (err) {
        addMessage("bot", "⚠️ Could not connect to the server.");
      }
    }

    msgForm.addEventListener("submit", (e) => {
      e.preventDefault();
      processMessage(userInput.value);
    });

    window.sendQuick = function(txt) {
      processMessage(txt);
    };

    clearBtn.addEventListener("click", () => {
      chatArea.innerHTML = `
        <div class="message bot">
          <div class="msg-icon"><i class="ri-robot-line"></i></div>
          <div class="bubble">
            Chat cleared! How else can I help you today?
            <span class="timestamp">${getTime()}</span>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
